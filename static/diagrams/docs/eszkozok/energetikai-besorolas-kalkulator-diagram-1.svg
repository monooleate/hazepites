<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="sans-serif">
  <rect width="900" height="460" fill="#f8fafc" rx="12"/>
  <text x="40" y="52" font-size="24" font-weight="bold" fill="#0f172a">Mi mozdítja a legtöbbet a besoroláson?</text>
  <text x="40" y="80" font-size="15" fill="#64748b">A négy fő tényező tipikus hatása egy családi ház fajlagos primerenergia-igényére</text>

  <!-- Bars -->
  <g transform="translate(40, 120)">
    <!-- Fűtési rendszer -->
    <text x="0" y="18" font-size="15" font-weight="bold" fill="#0f172a">Fűtési rendszer</text>
    <rect x="230" y="2" width="560" height="24" rx="6" fill="#e2e8f0"/>
    <rect x="230" y="2" width="560" height="24" rx="6" fill="#0d9488"/>
    <text x="800" y="19" text-anchor="end" font-size="13" font-weight="bold" fill="#ffffff">legnagyobb kar</text>

    <!-- Hőszigetelés -->
    <text x="0" y="68" font-size="15" font-weight="bold" fill="#0f172a">Hőszigetelés</text>
    <rect x="230" y="52" width="560" height="24" rx="6" fill="#e2e8f0"/>
    <rect x="230" y="52" width="460" height="24" rx="6" fill="#14b8a6"/>
    <text x="678" y="69" text-anchor="end" font-size="13" font-weight="bold" fill="#ffffff">nagy hatás</text>

    <!-- Szellőzés -->
    <text x="0" y="118" font-size="15" font-weight="bold" fill="#0f172a">Szellőzés (rekuperátor)</text>
    <rect x="230" y="102" width="560" height="24" rx="6" fill="#e2e8f0"/>
    <rect x="230" y="102" width="300" height="24" rx="6" fill="#2dd4bf"/>
    <text x="518" y="119" text-anchor="end" font-size="13" font-weight="bold" fill="#0f172a">közepes</text>

    <!-- Nyílászárók -->
    <text x="0" y="168" font-size="15" font-weight="bold" fill="#0f172a">Nyílászárók</text>
    <rect x="230" y="152" width="560" height="24" rx="6" fill="#e2e8f0"/>
    <rect x="230" y="152" width="230" height="24" rx="6" fill="#5eead4"/>
    <text x="448" y="169" text-anchor="end" font-size="13" font-weight="bold" fill="#0f172a">kisebb</text>

    <!-- Napelem -->
    <text x="0" y="218" font-size="15" font-weight="bold" fill="#0f172a">Napelem (beszámítás)</text>
    <rect x="230" y="202" width="560" height="24" rx="6" fill="#e2e8f0"/>
    <rect x="230" y="202" width="330" height="24" rx="6" fill="#facc15"/>
    <text x="548" y="219" text-anchor="end" font-size="13" font-weight="bold" fill="#0f172a">változó</text>
  </g>

  <text x="40" y="410" font-size="13" fill="#94a3b8">A pontos súly háztól függ. A napelem a hőigényt nem csökkenti, csak a primerenergia-mérlegbe számít be.</text>
  <text x="40" y="435" font-size="13" font-weight="bold" fill="#0d9488">hazepitesikalauz.hu</text>
</svg>
