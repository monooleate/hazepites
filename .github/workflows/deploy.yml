name: Build check

# ⚠️ Ez a workflow KORÁBBAN deployolt is (denoland/deployctl@v1), de a Deno Deploy
#    Classic 2026-07-20-án megszűnt → a lépés azóta MINDEN pushnál elhasalt
#    (utolsó sikeres futás: 2026-07-14). Az oldal deployja azóta a Deno Deploy saját
#    GitHub-integrációján megy: a 2026-08-10-i pushnál az új tracker percen belül
#    élesbe került, MIKÖZBEN ez a workflow bukott → a deploy bizonyíthatóan NEM ezen
#    a workflow-n keresztül történik.
#    A build-lépés viszont értékes (elkapja a fordítási hibát), ezért a halott
#    deploy-lépés törölve, a build CI-kapuként marad — és a workflow neve is
#    ezt mondja, nem többet.

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build step
        run: "deno task build"
